name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  odoo:
    name: Odoo 19 install and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Start PostgreSQL
        run: docker compose up -d db

      - name: Install the modules and run their tests
        run: |
          docker compose run --rm odoo odoo -d ci -i workshop_os,workshop_os_nfse \
            --test-enable --test-tags /workshop_os,/l10n_br_nfse_nacional,/workshop_os_nfse \
            --stop-after-init --log-level=test 2>&1 | tee test.log
          grep -E "tests.result: 0 failed, 0 error\(s\)" test.log
          ! grep -E " (ERROR|CRITICAL) " test.log

      - name: Install with demo data in Portuguese
        run: |
          docker compose run --rm odoo odoo -d demo -i workshop_os,workshop_os_nfse --with-demo \
            --load-language=pt_BR --stop-after-init 2>&1 | tee demo.log
          ! grep -E " (ERROR|CRITICAL) |UserWarning" demo.log

  image:
    name: Production image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t oficina-os .

  self-hosted:
    name: Self-hosted stack (compose, own PostgreSQL, demo data)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Start Odoo with its own PostgreSQL
        run: |
          cat > deploy/.env <<ENV
          ODOO_ADMIN_EMAIL=ci@example.com
          ODOO_ADMIN_PASSWORD=ci-admin-$RANDOM$RANDOM
          DB_PASSWORD=ci-db-$RANDOM$RANDOM
          LOAD_DEMO=true
          ENV
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build

      - name: Wait for the first boot and log in as the demo office user
        run: |
          # The entrypoint's "preparing" page also passes /web/health; only Odoo reports the database.
          for i in $(seq 1 90); do
            curl -fsS "http://127.0.0.1:8069/web/health?db_server_status=1" | grep -q '"db_server_status": true' && break
            sleep 5
          done
          curl -fsS -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","method":"call","params":{"db":"odoo","login":"escritorio","password":"escritorio"}}' \
            http://127.0.0.1:8069/web/session/authenticate | grep -q '"uid"'

      - name: Logs
        if: always()
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env logs odoo | tail -50
