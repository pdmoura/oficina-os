# Keeps the public demo responsive. Render's free plan sleeps after 15 idle minutes, and a free Supabase
# project pauses after a week without database activity. When the repository variable KEEPALIVE_URL is set
# (e.g. https://oficina-os.onrender.com), this calls the health check with db_server_status=1, which also
# opens a database connection, every 10 minutes from 07:00 to 21:00 in Brazil, Monday to Saturday.
# GitHub turns scheduled workflows off after 60 days without commits: re-enable it in the Actions tab.
name: Keep alive

on:
  schedule:
    - cron: "*/10 10-23 * * 1-6"
  workflow_dispatch:

jobs:
  ping:
    if: ${{ vars.KEEPALIVE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Wake the web service and touch the database
        run: curl -fsS --max-time 120 --retry 2 --retry-delay 20 "${{ vars.KEEPALIVE_URL }}/web/health?db_server_status=1"
