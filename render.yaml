# Render Blueprint: one free web service running the Docker image, on any PostgreSQL 13+ (Supabase, Neon...).
# Set DB_* below, or add DATABASE_URL instead of them (see README, section Database).
# Secrets are marked sync: false, so Render asks for them when the Blueprint is created.
services:
  - type: web
    name: oficina-os
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /web/health
    autoDeploy: true
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: odoo
      - key: ODOO_ADMIN_EMAIL
        sync: false
      - key: ODOO_ADMIN_PASSWORD
        sync: false
      - key: LOAD_DEMO
        value: "false"
